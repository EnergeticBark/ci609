openapi: 3.1.0
info:
  title: Zap App REST API
  version: 1.0.0
servers:
  - url: https://bsh23.brighton.domains/ci609/assignment1/api
paths:
  /sightings:
    post:
      summary: Add a pangolin sighting
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                deathType:
                  $ref: "#/components/schemas/DeathType"
                time:
                  type: integer
                latitude:
                  type: number
                  format: double
                longitude:
                  type: number
                  format: double
                accuracy:
                  type: number
                  format: double
                image:
                  type: string
                  format: binary
                notes:
                  nullable: true
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
        "400":
          description: Bad Request
    get:
      summary: Get a list of pangolin sightings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SightingPreview"
        "204":
          description: No Content

  /sightings/{id}:
    get:
      summary: Get information about a specific pangolin sighting by ID
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Unique ID of the pangolin sighting
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sighting"
        "404":
          description: Not Found

components:
  schemas:
    DeathType:
      type: string
      nullable: true
      enum:
        - fence
        - fenceElectrocuted
        - road
        - other
        - null
    PostResponse:
      type: object
      properties:
        id:
          type: integer
      example:
        id: 1
    SightingPreview:
      type: object
      properties:
        id:
          type: integer
        deathType:
          $ref: "#/components/schemas/DeathType"
        time:
          type: integer
        image:
          type: string
          format: binary
    Sighting:
      allOf:
        - $ref: "#/components/schemas/SightingPreview"
        - type: object
        - properties:
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
            accuracy:
              type: number
              format: double
            notes:
              nullable: true
              type: string

  
